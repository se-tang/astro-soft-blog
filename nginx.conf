map $http_x_forwarded_proto $rss_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 使用相对路径重定向，避免反代或非 80 端口（如 :8080）跳转时丢失端口号
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/xml text/xml image/svg+xml;

    # RSS 链接自动跟随用户当前访问的协议、域名与端口（支持直接 IP:端口 与反代域名）
    location = /rss.xml {
        sub_filter_types application/xml text/xml;
        sub_filter 'https://__site_origin__' '$rss_scheme://$http_host';
        sub_filter_once off;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    location ~* \.(woff2|css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
